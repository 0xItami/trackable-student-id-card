# ngrok endpoints for SIID-01 (used by KEEP_ONLINE.ps1; the authtoken stays in
# ngrok's own default config, which is loaded alongside this file).
#   http://  -> for the card: the A7670 modem posts plain HTTP, no TLS
#   https:// -> for phones and browsers, which switch links to https on their own
version: 3
endpoints:
  - name: siid-card-http
    url: http://frill-relay-nacho.ngrok-free.dev
    # Plain HTTP exists only for the card. Everything except its two POST paths
    # (login, dashboard, API) is redirected to https so no password or session
    # cookie ever crosses the internet unencrypted.
    traffic_policy:
      on_http_request:
        - expressions:
            - "!(req.url.path in ['/api/ingest', '/api/heartbeat'])"
          actions:
            - type: redirect
              config:
                from: "^http://([^/]+)(.*)$"
                to: "https://$1$2"
                status_code: 302
    upstream:
      url: http://127.0.0.1:5000
  - name: siid-browser-https
    url: https://frill-relay-nacho.ngrok-free.dev
    upstream:
      url: http://127.0.0.1:5000
